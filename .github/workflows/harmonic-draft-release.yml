name: Harmonic Draft Release

# Creates a draft GitHub release for this Firedancer-only fork.
#
# Run from a harmonic release branch (vX.Y-harmonic).  Builds the
# firedancer binary, checks the tree is clean, then tags
# v<version>-harmonic at the branch HEAD using the exact version the
# binary reports.  The tag is created only when the draft is published.
#
# The branch major.minor must match src/app/firedancer/version.mk, e.g.
# v26.09-harmonic for 26.09.x.  Upstream's v0.12xx line is
# Frankendancer's, and this fork no longer builds it.
#
# release_type sets the network: 'prerelease' -> Testnet pre-release,
# 'latest' -> Mainnet.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type: 'prerelease' (Testnet, marked pre-release) or 'latest' (Mainnet, marked latest)"
        required: true
        type: choice
        options:
          - prerelease
          - latest
        default: prerelease
      changelog:
        description: "Changelog for the release (markdown, e.g. '- Minor bugfixes')"
        required: false
        type: string
        default: ""
      harmonic_patch:
        description: "Harmonic patch number for a release between upstream versions (e.g. '1' -> ...-harmonic.1). Leave blank for a normal release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      branch: ${{ steps.plan.outputs.branch }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate release branch
        id: plan
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          if ! echo "${branch}" | grep -qE '^v[0-9]+\.[0-9]+-harmonic$'; then
            echo "::error::Run this workflow from a release branch named 'vX.Y-harmonic' (got '${branch}')"
            exit 1
          fi
          major="$(echo "${branch}" | sed -E 's/^v([0-9]+)\.[0-9]+-harmonic$/\1/')"
          minor="$(echo "${branch}" | sed -E 's/^v[0-9]+\.([0-9]+)-harmonic$/\1/')"

          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          echo "major=${major}" >> "${GITHUB_OUTPUT}"
          echo "minor=${minor}" >> "${GITHUB_OUTPUT}"
          echo "Releasing firedancer from ${branch}"

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          FD_AUTO_INSTALL_PACKAGES=1 ./deps.sh check
          CC=gcc CXX=g++ FD_AUTO_INSTALL_PACKAGES=1 ./deps.sh +dev fetch install

      - name: Build release binary
        run: |
          set -e
          make -j "$(nproc)" firedancer

      - name: Ensure the working tree is clean
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build left the working tree dirty:"
            git status --porcelain
            exit 1
          fi

      - name: Compute expected version, tag, and verify the binary
        id: version
        env:
          BRANCH_MAJOR: ${{ steps.plan.outputs.major }}
          BRANCH_MINOR: ${{ steps.plan.outputs.minor }}
          HARMONIC_PATCH: ${{ inputs.harmonic_patch }}
        run: |
          set -euo pipefail

          read_mk() { sed -nE "s/^$1[[:space:]]*:=[[:space:]]*([0-9]+).*/\1/p" "$2"; }

          vmk="src/app/firedancer/version.mk"
          vmaj="$(read_mk FD_VERSION_MAJOR "${vmk}")"
          vmin="$(read_mk FD_VERSION_MINOR "${vmk}")"
          vpat="$(read_mk FD_VERSION_PATCH "${vmk}")"

          # The source version must match the branch it is released from.
          # The branch minor is zero-padded (v26.09), version.mk's is not.
          if [ "$((10#${vmaj}))" -ne "$((10#${BRANCH_MAJOR}))" ] || [ "$((10#${vmin}))" -ne "$((10#${BRANCH_MINOR}))" ]; then
            echo "::error::${vmk} is ${vmaj}.${vmin} but branch is v${BRANCH_MAJOR}.${BRANCH_MINOR}"
            exit 1
          fi

          # Matches fd_version_cstr_format(): minor is zero-padded from 26.
          expected="${vmaj}.$(printf '%02d' "${vmin}").${vpat}"

          # Sanity-check the built binary against the expected version.
          # `firedancer version` prints "<version> (<commit>)".
          raw_version="$(build/native/gcc/bin/firedancer version | awk '{print $1}')"
          if [ "${raw_version}" != "${expected}" ]; then
            echo "::error::firedancer reports ${raw_version} but source expects ${expected}"
            exit 1
          fi

          # Optionally append a harmonic patch number for a release between
          # upstream versions, e.g. v26.09.5-harmonic.1.
          tag="v${expected}-harmonic"
          if [ -n "${HARMONIC_PATCH}" ]; then
            if ! echo "${HARMONIC_PATCH}" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::harmonic_patch must be a positive integer (got '${HARMONIC_PATCH}')"
              exit 1
            fi
            tag="${tag}.${HARMONIC_PATCH}"
          fi

          echo "Expected ${expected} (binary reported ${raw_version}) -> tag ${tag}"
          echo "version=${expected}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          BRANCH: ${{ needs.build.outputs.branch }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists"
            exit 1
          fi

          if [ "${RELEASE_TYPE}" = "prerelease" ]; then
            net="Testnet"
            header="This is a Testnet only release."
          else
            net="Mainnet"
            header="This is a stable release suitable for Testnet and Mainnet Beta."
          fi

          cat > notes.md <<EOF
          ${header}

          ## What's Changed

          ### Firedancer (\`firedancer\`)

          - Upstream Changes: https://github.com/firedancer-io/firedancer/releases/tag/v${VERSION}

          ${CHANGELOG}
          EOF

          args=(--draft --target "${BRANCH}" --title "Firedancer ${net} ${TAG}" --notes-file notes.md)
          if [ "${RELEASE_TYPE}" = "prerelease" ]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          gh release create "${TAG}" "${args[@]}"
