syntax = "proto3";

package inertia.v1;

service Stream {
  rpc Subscribe(SubscribeRequest) returns (stream Update);
  rpc SubscribeLeader(SubscribeLeaderRequest) returns (stream Update);
}

message SubscribeRequest {
  // 32-byte pubkeys. A transaction matches if any of its account keys
  // appear here. Empty means no transactions.
  repeated bytes accounts = 1;
}

message SubscribeLeaderRequest {}

message TxnError {
  int32 error = 1;
  int32 instruction_error = 2;
  uint32 instruction = 3;
  uint32 custom = 4;
}

message TxnUpdate {
  uint64 slot = 1;
  bytes signature = 2;
  bool success = 3;
  uint64 index = 4;
  bytes payload = 5;
  repeated bytes loaded_writable = 6;
  repeated bytes loaded_readonly = 7;
  TxnError error = 8;
}

message BundleOutcome {
  uint64 slot = 1;
  bool landed = 2;
  repeated bytes signatures = 3;
  repeated TxnError errors = 4;
}

message Gap {
  uint64 dropped = 1;
  uint64 slot = 2;
}

message Update {
  oneof update {
    TxnUpdate txn = 1;
    Gap gap = 2;
    BundleOutcome bundle = 3;
  }
}
