syntax = "proto3";

package inertia.v1;

service Stream {
  rpc Subscribe(SubscribeRequest) returns (stream Update);
}

message SubscribeRequest {
  // 32-byte pubkeys. A transaction matches if any of its account keys
  // appear here. Empty means no transactions.
  repeated bytes accounts = 1;
  bool include_votes = 2;
  bool include_failed = 3;
  bool include_slots = 4;
}

enum CommitmentLevel {
  COMMITMENT_LEVEL_UNSPECIFIED = 0;
  COMMITMENT_LEVEL_PROCESSED = 1;
  COMMITMENT_LEVEL_CONFIRMED = 2;
  COMMITMENT_LEVEL_FINALIZED = 3;
}

message SlotUpdate {
  uint64 slot = 1;
  uint64 parent_slot = 2;
  uint64 block_height = 3;
  bytes block_hash = 4;
  CommitmentLevel commitment = 5;
}

message CompiledInstruction {
  uint32 program_id_index = 1;
  bytes accounts = 2;
  bytes data = 3;
}

message TxnUpdate {
  uint64 slot = 1;
  bytes signature = 2;
  bool success = 3;
  int32 err = 4;
  bool is_vote = 5;
  repeated bytes account_keys = 6;
  repeated CompiledInstruction instructions = 7;
}

message Gap {
  uint64 dropped = 1;
  uint64 slot = 2;
}

message Update {
  oneof update {
    SlotUpdate slot = 1;
    TxnUpdate txn = 2;
    Gap gap = 3;
  }
}
